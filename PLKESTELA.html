<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pleca Pollito Estela</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap');
:root{
  --oro:#E8D9A0; --oro-bri:#F4E9C1; --oro-deep:#B8934A;
  --card1:rgba(13,74,55,0.90); --card2:rgba(5,30,22,0.92); --esm-bri:rgba(28,110,84,0.55);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;background:transparent;}
/* NADA de tinte a pantalla completa: se ve el cantante limpio */

/* franja inferior (lower third) dentro del safe area */
#pleca{position:fixed;left:0;right:0;bottom:64px;height:150px;overflow:hidden;}
/* leve base detras SOLO de la franja, para contraste sin tapar el escenario */
#pleca::before{content:"";position:absolute;inset:0;
  background:linear-gradient(to top, rgba(2,14,11,0.28), rgba(2,14,11,0.10) 60%, transparent);
  pointer-events:none;}


/* grupo pollito + mensaje que cruza la pleca */
.lt{position:absolute;bottom:34px;left:0;display:flex;align-items:center;will-change:transform,opacity;z-index:3;}
/* tarjeta (va detras, jalada) */
.lt-card{position:relative;max-width:760px;padding:13px 22px;border-radius:16px;
  background:linear-gradient(140deg,var(--card1) 0%,var(--esm-bri) 45%,var(--card2) 100%);
  border:1.5px solid var(--oro-deep);
  box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(232,217,160,.22),
    inset 0 0 0 1px rgba(244,233,193,.30);
  backdrop-filter:blur(3px);}
.lt-card::before{content:"";position:absolute;top:7px;left:16px;width:54px;height:16px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.22),transparent 70%);pointer-events:none;}
.lt-text{color:#fdf8ea;font-size:19px;line-height:1.3;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.55);white-space:nowrap;}
.lt-from{color:var(--oro);font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;margin-top:3px;}
/* hilito dorado que une pollito y tarjeta */
.lt-thread{width:44px;height:2px;background:linear-gradient(90deg,transparent,var(--oro));opacity:.6;margin:0 -2px;}
/* pollito (adelante, jalando) */
.lt-bird{width:66px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
  transform-origin:60% 90%;animation:flap 2.6s ease-in-out infinite;}
.lt-bird img{width:100%;display:block;}
@keyframes flap{0%,100%{transform:rotate(-1.2deg) translateY(0);}50%{transform:rotate(1.2deg) translateY(-2px);}}
</style>
</head>

const MENSAJES=[
 {texto:"Que orgullo ver a Bohemia Suburbana en los Estela",from:"Familia Xocop, Mixco"},
 {texto:"Saludos desde Xela, esperando a Los Rabanes",from:"Familia Perez, Quetzaltenango"},
 {texto:"Amy Pantaleon canto bellisimo, se me enchino la piel",from:"Familia Sican, Chimaltenango"},
 {texto:"Que viva la marimba y que viva Guatemala",from:"Don Chus, Antigua Guatemala"},
 {texto:"Elaine Haro y Voelin cantaron increible, orgullo chapin",from:"Familia Lopez, Peten"},
 {texto:"Bravo por Fabiola Roudha y Maria del Sol",from:"Dona Rosa, Zacapa"},
 {texto:"Aqui reunidos con la abuela viendo los Estela",from:"Familia Tzunun, Solola"},
 {texto:"Saludos a los paisanos desde Estados Unidos",from:"Familia Guatemalteca, Los Angeles"},
];

/* ---- conexion en vivo con Google Sheets ---- */
const SHEET_ID="1kPeA4wdFZgrcS6H9lAvxqzakGtiTB9velet2EPBdYYs";
const SHEET_NAME="Hoja 1";
const REFRESH_MS=20000;
function parseCSV(t){const rows=[];let row=[],c="",q=false;for(let k=0;k<t.length;k++){const ch=t[k];
 if(q){if(ch==='"'){if(t[k+1]==='"'){c+='"';k++;}else q=false;}else c+=ch;}
 else{if(ch==='"')q=true;else if(ch===','){row.push(c);c="";}else if(ch==='\n'){row.push(c);rows.push(row);row=[];c="";}else if(ch==='\r'){}else c+=ch;}}
 if(c.length||row.length){row.push(c);rows.push(row);}return rows;}
async function cargarSheet(){try{
 const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
 const r=await fetch(url,{cache:"no-store"});if(!r.ok)return;const rows=parseCSV(await r.text());
 const lista=[];for(const row of rows){const tx=(row[0]||"").trim();if(!tx)continue;lista.push({texto:tx,from:(row[1]||"").trim()});}
 if(lista.length){MENSAJES.length=0;lista.forEach(m=>MENSAJES.push(m));}}catch(e){}}
cargarSheet();setInterval(cargarSheet,REFRESH_MS);

const pleca=document.getElementById('pleca');
let idx=0;
const HOLD=6500;      // tiempo legible en el centro (sutil, sin prisa)
const CROSS=2600;     // entrada/salida
const GAP=1200;       // respiro entre mensajes

function mostrar(){
  const d=MENSAJES[idx%MENSAJES.length]; idx++;
  const g=document.createElement('div'); g.className='lt';
  g.innerHTML=`
    <div class="lt-card">
      <div class="lt-text">${d.texto}</div>
      ${d.from?`<div class="lt-from">${d.from}</div>`:''}
    </div>
    <div class="lt-thread"></div>
    <div class="lt-bird"><img src="${BIRD}"></div>`;
  pleca.appendChild(g);

  // medir para posicionar centrado
  const w=g.offsetWidth;
  const restX=(window.innerWidth - w)/2;   // reposo centrado
  const inX=-w-60;                         // fuera por la izquierda
  const outX=window.innerWidth+60;         // sale por la derecha

  // entra jalado por el pollito -> reposa -> el pollito lo jala afuera
  g.animate([
    {transform:`translateX(${inX}px)`,opacity:0},
    {transform:`translateX(${restX}px)`,opacity:1,offset:CROSS/(CROSS*2+HOLD)},
    {transform:`translateX(${restX}px)`,opacity:1,offset:(CROSS+HOLD)/(CROSS*2+HOLD)},
    {transform:`translateX(${outX}px)`,opacity:0}
  ],{duration:CROSS*2+HOLD,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});

  setTimeout(()=>g.remove(), CROSS*2+HOLD+100);
  setTimeout(mostrar, CROSS*2+HOLD+GAP);
}
mostrar();
</script>
