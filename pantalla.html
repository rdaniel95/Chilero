<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimátum · Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff2e7e; --pink-d:#c9105c; --pink-l:#ff5e9c;
    --green:#79d94f; --green-d:#3f9e2a;
    --red:#ff3838; --red-d:#b81616;
    --slot:rgba(255,255,255,.10); --slot-b:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#12002a}
  body{font-family:'Montserrat',system-ui,sans-serif;color:#fff}

  #fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{
    width:1920px;height:1080px;position:relative;transform-origin:center center;
    background:
      radial-gradient(900px 600px at 12% 88%, rgba(255,46,126,.55), transparent 60%),
      radial-gradient(1000px 700px at 88% 12%, rgba(14,116,224,.55), transparent 60%),
      radial-gradient(700px 700px at 92% 92%, rgba(120,217,79,.28), transparent 60%),
      radial-gradient(700px 500px at 6% 6%, rgba(120,60,220,.5), transparent 60%),
      linear-gradient(135deg,#3a0d5e 0%, #7b1e8f 46%, #0b2a6b 100%);
    overflow:hidden;
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(320px 220px at 26% 30%, rgba(255,120,60,.35), transparent 70%),
      radial-gradient(280px 200px at 70% 70%, rgba(60,200,255,.30), transparent 70%);
    filter:blur(6px);mix-blend-mode:screen;opacity:.8;
  }

  .title{
    position:absolute;top:34px;left:0;right:0;text-align:center;
    font-weight:900;font-size:96px;letter-spacing:.03em;line-height:1;
    text-shadow:0 6px 30px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.15);
  }

  .board{position:absolute;left:0;right:0;top:170px;bottom:40px;padding:0 70px;display:flex;flex-direction:column}

  .heads{
    display:grid;align-items:end;
    grid-template-columns:var(--photo) 1fr var(--vidasW) var(--gap2) var(--aciW);
    column-gap:var(--colgap);
    padding:0 6px 10px;
  }
  .heads .h{font-weight:800;letter-spacing:.14em;color:#fff;opacity:.92;text-align:center;font-size:var(--headf);text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .heads .h.vidas{grid-column:3}
  .heads .h.aci{grid-column:5}

  .rows{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:var(--rowgap)}
  .row{
    height:var(--rh);
    display:grid;align-items:center;
    grid-template-columns:var(--photo) 1fr var(--vidasW) var(--gap2) var(--aciW);
    column-gap:var(--colgap);
  }

  /* Foto */
  .pic{
    width:var(--photo);height:var(--photo);border-radius:calc(var(--photo)*.14);
    background:#0a0620;border:3px solid #fff;overflow:hidden;position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .pic.dead img{filter:grayscale(.6) brightness(.7)}
  .pic .x{position:absolute;inset:0;display:none}
  .row.dead .pic .x{display:block}

  /* Nombre */
  .name{
    height:var(--pillh);border-radius:calc(var(--pillh)/2);
    background:linear-gradient(180deg,var(--pink-l),var(--pink-d));
    display:flex;align-items:center;padding:0 calc(var(--pillh)*.5);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 6px 16px rgba(180,10,80,.4);
    overflow:hidden;
  }
  .row.dead .name{background:linear-gradient(180deg,#8f6f86,#5a3a52);box-shadow:none}
  .name span{
    font-weight:900;font-size:var(--namef);letter-spacing:.01em;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
    text-shadow:0 2px 6px rgba(0,0,0,.35);
  }

  /* Vidas */
  .vidas,.aci{display:flex;align-items:center;justify-content:center;gap:var(--dotgap)}
  .dot{width:var(--dot);height:var(--dot);border-radius:50%;position:relative;flex:0 0 auto}
  .dot.alive{background:radial-gradient(circle at 38% 32%, #bff59a, var(--green) 55%, var(--green-d));
    box-shadow:0 0 calc(var(--dot)*.3) rgba(120,217,79,.6), inset 0 2px 4px rgba(255,255,255,.4)}
  .dot.lost{background:radial-gradient(circle at 38% 32%, #ff9a9a, var(--red) 55%, var(--red-d));
    box-shadow:inset 0 2px 4px rgba(255,255,255,.3)}

  /* Aciertos */
  .slot{
    width:var(--dot);height:var(--dot);border-radius:50%;flex:0 0 auto;
    background:var(--slot);border:2px solid var(--slot-b);
    display:flex;align-items:center;justify-content:center;
  }
  .slot.on{
    background:radial-gradient(circle at 38% 32%, #bff59a, var(--green) 55%, var(--green-d));
    border-color:rgba(255,255,255,.5);
    box-shadow:0 0 calc(var(--dot)*.3) rgba(120,217,79,.55), inset 0 2px 4px rgba(255,255,255,.4);
  }
  .slot svg{width:60%;height:60%;display:none}
  .slot.on svg{display:block}

  .waiting{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;text-align:center;
  }
  .waiting h2{font-size:44px;font-weight:800;opacity:.9}
  .waiting p{font-size:22px;opacity:.6;font-weight:600}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="fit">
  <div class="stage" id="stage">
    <div class="title">ULTIMÁTUM</div>
    <div class="board hide" id="board">
      <div class="heads">
        <div class="h vidas">VIDAS</div>
        <div class="h aci">ACIERTOS</div>
      </div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="waiting" id="waiting">
      <h2>Esperando a la cabina…</h2>
      <p>Abre index.html y arma la ronda</p>
    </div>
  </div>
</div>

<script>
const MAX_VIDAS = 2, MAX_ACIERTOS = 6;
const LS_STATE = 'ultimatum_state_v1';
const rows = document.getElementById('rows');
const board = document.getElementById('board');
const waiting = document.getElementById('waiting');
const stage = document.getElementById('stage');

/* ---- Escalado a la ventana (broadcast 1920x1080) ---- */
function fit(){
  const k = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform = 'scale('+k+')';
}
window.addEventListener('resize', fit); fit();

/* ---- Auto-fit de filas según cuántos jueguen ---- */
function applyMetrics(n){
  n = Math.max(1, n);
  const boardH = 1080 - 170 - 40;      // alto disponible del área de juego
  const headH = 54;                    // cabecera VIDAS/ACIERTOS
  const avail = boardH - headH;
  const rowgap = n <= 6 ? 16 : 12;
  const rh = Math.floor((avail - rowgap*(n-1)) / n);

  const photo  = Math.round(rh * 0.82);
  const pillh  = Math.round(rh * 0.62);
  const namef  = Math.round(rh * 0.40);
  const dot    = Math.round(rh * 0.42);
  const dotgap = Math.round(rh * 0.18);
  const headf  = Math.max(20, Math.round(rh * 0.26));

  const vidasW = MAX_VIDAS*dot + (MAX_VIDAS-1)*dotgap;
  const aciW   = MAX_ACIERTOS*dot + (MAX_ACIERTOS-1)*dotgap;

  const s = stage.style;
  s.setProperty('--rh', rh+'px');
  s.setProperty('--rowgap', rowgap+'px');
  s.setProperty('--photo', photo+'px');
  s.setProperty('--pillh', pillh+'px');
  s.setProperty('--namef', namef+'px');
  s.setProperty('--dot', dot+'px');
  s.setProperty('--dotgap', dotgap+'px');
  s.setProperty('--headf', headf+'px');
  s.setProperty('--vidasW', vidasW+'px');
  s.setProperty('--aciW', aciW+'px');
  s.setProperty('--gap2', '0px');
  s.setProperty('--colgap', Math.round(rh*0.5)+'px');
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="#0a3d00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XMARK = `<svg class="x" viewBox="0 0 100 100" preserveAspectRatio="none">
  <line x1="12" y1="12" x2="88" y2="88" stroke="#ff2323" stroke-width="12" stroke-linecap="round"/>
  <line x1="88" y1="12" x2="12" y2="88" stroke="#ff2323" stroke-width="12" stroke-linecap="round"/>
</svg>`;

function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(players){
  players = Array.isArray(players) ? players.slice(0, 10) : [];
  if(!players.length){
    board.classList.add('hide'); waiting.classList.remove('hide'); return;
  }
  waiting.classList.add('hide'); board.classList.remove('hide');
  applyMetrics(players.length);

  rows.innerHTML = players.map(p=>{
    const vidas = Math.max(0, Math.min(MAX_VIDAS, p.vidas ?? MAX_VIDAS));
    const aci   = Math.max(0, Math.min(MAX_ACIERTOS, p.aciertos ?? 0));
    const dead  = vidas === 0;

    // vidas: las perdidas (rojas) primero, luego las que quedan (verdes)
    let vd = '';
    for(let i=0;i<MAX_VIDAS;i++){
      const lost = i < (MAX_VIDAS - vidas);
      vd += `<div class="dot ${lost?'lost':'alive'}"></div>`;
    }
    let ac = '';
    for(let i=0;i<MAX_ACIERTOS;i++){
      ac += `<div class="slot ${i<aci?'on':''}">${CHECK}</div>`;
    }
    const img = p.foto ? `<img src="${p.foto}" alt="">` : '';
    return `<div class="row ${dead?'dead':''}">
      <div class="pic ${dead?'dead':''}">${img}${XMARK}</div>
      <div class="name"><span>${esc(p.nombre)}</span></div>
      <div class="vidas">${vd}</div>
      <div></div>
      <div class="aci">${ac}</div>
    </div>`;
  }).join('');
}

/* ---- Sincronización con la cabina ---- */
let bc;
function connect(){
  try{
    bc = new BroadcastChannel('ultimatum');
    bc.onmessage = ev=>{
      const m = ev.data || {};
      if(m.type === 'state'){ render(m.players); saveLocal(m.players); }
    };
    bc.postMessage({ type:'hello' });   // pedir estado actual al conectarse
  }catch(e){ /* sin BroadcastChannel: solo localStorage */ }
}
function saveLocal(players){ try{ localStorage.setItem(LS_STATE, JSON.stringify(players)); }catch(e){} }
function loadLocal(){ try{ const r = localStorage.getItem(LS_STATE); if(r) render(JSON.parse(r)); }catch(e){} }

// Reconexión al recuperar foco (cabina de broadcast pierde/recupera pestaña)
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ try{ bc && bc.postMessage({type:'hello'}); }catch(e){} }
});
// localStorage como respaldo entre pestañas/recargas
window.addEventListener('storage', e=>{
  if(e.key === LS_STATE && e.newValue){ try{ render(JSON.parse(e.newValue)); }catch(err){} }
});

loadLocal();
connect();
</script>
</body>
</html>
